name: Setup GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  setup:
    name: Initialize gh-pages branch
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check if gh-pages exists
        id: check
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "gh-pages branch already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "gh-pages branch does not exist"
          fi
      
      - name: Create gh-pages branch
        if: steps.check.outputs.exists == 'false'
        run: |
          # Create orphan branch
          git checkout --orphan gh-pages
          
          # Remove all files
          git rm -rf . || true
          
          # Create initial index.html
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>E2E Test Reports</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0d1117;
                color: #e6edf3;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
              }
              .container {
                text-align: center;
                padding: 2rem;
              }
              h1 { margin-bottom: 1rem; }
              p { color: #8b949e; }
              a { color: #58a6ff; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🎭 E2E Test Reports</h1>
              <p>Reports will appear here after the first test run.</p>
              <p><a href="reports/">View Reports Index</a></p>
            </div>
          </body>
          </html>
          EOF
          
          # Create empty manifest
          echo '{"pr":{},"scheduled":{"stage":[],"prod":[]},"metadata":{"lastUpdated":"","totalReports":0}}' > manifest.json
          
          # Create reports directory with placeholder
          mkdir -p reports
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=../"></head></html>' > reports/index.html
          
          # Create .nojekyll to disable Jekyll processing
          touch .nojekyll
          
          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize gh-pages branch for E2E reports"
          git push origin gh-pages
          
          echo "✅ gh-pages branch created successfully"
      
      - name: Configure GitHub Pages
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "============================================"
          echo "GitHub Pages Setup Instructions"
          echo "============================================"
          echo ""
          echo "The gh-pages branch has been created."
          echo ""
          echo "To complete setup, go to:"
          echo "  Settings → Pages → Source"
          echo ""
          echo "Select:"
          echo "  - Source: Deploy from a branch"
          echo "  - Branch: gh-pages"
          echo "  - Folder: / (root)"
          echo ""
          echo "============================================"
